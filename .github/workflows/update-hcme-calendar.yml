name: Update HCME calendar

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'update.py'
      - '.github/workflows/update-hcme-calendar.yml'

permissions:
  contents: write

concurrency:
  group: hcme-calendar-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover Frauen league
        run: |
          python - <<'PY'
          import json, urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed

          def probe(cl):
              url=f'https://spo.handball4all.de/service/if_g_json.php?ca=0&cl={cl}&cmd=ps&og=216'
              try:
                  with urllib.request.urlopen(url, timeout=4) as r:
                      data=json.load(r)
              except Exception:
                  return None
              raw=json.dumps(data, ensure_ascii=False)
              if 'HC Metter-Enz' not in raw:
                  return None
              return cl, data

          with ThreadPoolExecutor(max_workers=24) as ex:
              futures={ex.submit(probe, cl):cl for cl in range(161400, 161701)}
              for f in as_completed(futures):
                  out=f.result()
                  if not out:
                      continue
                  cl,data=out
                  obj=data[0] if isinstance(data,list) and data else {}
                  c=obj.get('content',{})
                  print('FOUND CL', cl)
                  print('TOP', {k:v for k,v in obj.items() if k != 'content'})
                  print('CONTENT_KEYS', list(c.keys()))
                  print('SCORE', c.get('score'))
                  for bucket in ('futureGames','pastGames'):
                      games=(c.get(bucket) or {}).get('games',[])
                      for g in games:
                          if 'HC Metter-Enz' in (g.get('gHomeTeam',''), g.get('gGuestTeam','')):
                              print(bucket, 'GAME', g)
          PY
      - name: Generate calendar
        run: python update.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hcme.ics
          git diff --cached --quiet || git commit -m "Update HCME calendar"
          git pull --rebase origin main
          git push
