name: Update HCME calendars

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'update.py'
      - 'test_ticker_lookup.py'
      - '.github/workflows/update-hcme-calendar.yml'

permissions:
  contents: write

concurrency:
  group: hcme-calendar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test ticker lookup
        run: python -m unittest -v test_ticker_lookup.py
      - name: Generate calendars
        run: python update.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update HCME calendars"
          git pull --rebase origin main
          git push
