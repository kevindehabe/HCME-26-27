name: Update HCME calendar

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-hcme-calendar.yml'

permissions:
  contents: write

concurrency:
  group: hcme-calendar-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locate Frauen Bezirksoberliga
        run: |
          python - <<'PY'
          import json, urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed

          ids=list(range(161571,161652,5))
          def probe(cl):
              url=f'https://spo.handball4all.de/service/if_g_json.php?ca=0&cl={cl}&cmd=ps&og=216'
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=10) as r: data=json.load(r)
              except Exception as e:
                  return cl,None,type(e).__name__
              obj=data[0] if isinstance(data,list) and data else {}
              head=obj.get('head',{})
              return cl,{'name':head.get('name'),'headline2':head.get('headline2'),'has_hcme':'HC Metter-Enz' in json.dumps(data,ensure_ascii=False)},None

          with ThreadPoolExecutor(max_workers=3) as ex:
              for f in as_completed([ex.submit(probe,cl) for cl in ids]):
                  print(f.result())
          PY
