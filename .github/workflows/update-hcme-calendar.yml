name: Update HCME calendars

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'update.py'
      - '.github/workflows/update-hcme-calendar.yml'

permissions:
  contents: write

concurrency:
  group: hcme-calendar-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate calendars
        run: python update.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hcme.ics frauen1.ics
          git diff --cached --quiet || git commit -m "Update HCME calendars"
          git pull --rebase origin main
          git push
