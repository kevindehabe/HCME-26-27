name: Inspect HCME Frauen team id

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-hcme-calendar.yml'

permissions:
  contents: read

concurrency:
  group: hcme-calendar-update
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read Frauen BOL team id
        run: |
          python - <<'PY'
          import json, urllib.request
          url='https://spo.handball4all.de/service/if_g_json.php?ca=0&cl=161581&cmd=ps&og=216'
          req=urllib.request.Request(url,headers={'User-Agent':'HCME-calendar/1.0'})
          with urllib.request.urlopen(req,timeout=30) as r:
              data=json.load(r)
          c=data[0]['content']
          print('SCORE', json.dumps(c.get('score'),ensure_ascii=False))
          print('TEAMS', json.dumps(c.get('teamsList'),ensure_ascii=False))
          PY
